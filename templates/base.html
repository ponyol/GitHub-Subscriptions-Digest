<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GitHub Subscriptions Digest{% endblock %}</title>
    <link rel="stylesheet" href="{{ css_path | default('static/style.css') }}">
    <meta name="description" content="Автоматический дайджест обновлений из GitHub репозиториев с AI-суммаризацией">
</head>
<body>
    <header>
        <h1>{% block header %}GitHub Subscriptions Digest{% endblock %}</h1>
        {% block breadcrumb %}{% endblock %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Сгенерировано автоматически с использованием GitHub Actions и Google Gemini AI</p>
        {% if last_run %}
        <p>Последнее обновление: {{ last_run | format_date }}</p>
        {% endif %}
    </footer>
</body>
</html>
